<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soft Gradients · 4K Wallpaper Pack</title>
<meta name="description" content="12 minimal gradient wallpapers for phone and desktop. Free download.">
<meta property="og:title" content="Soft Gradients · 4K Wallpaper Pack">
<meta property="og:description" content="12 minimal gradient wallpapers for phone and desktop. Free download.">
<style>
  :root { --bg:#f6f7fb; --fg:#1b1c20; --muted:#5b5e6a; --card:#fff; --accent:#3d5afe; --on-accent:#fff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#121316; --fg:#e6e7ec; --muted:#a3a6b2; --card:#1c1d22; --accent:#8c9eff; --on-accent:#0b1033; }
  }
  * { box-sizing:border-box; }
  html,body { margin:0; background:var(--bg); color:var(--fg); font-family:system-ui,sans-serif; }
  main { max-width:960px; margin:0 auto; padding:32px 16px 48px; }
  h1 { margin:0 0 6px; font-weight:600; font-size:28px; }
  .sub { margin:0 0 20px; color:var(--muted); }
  .dl { display:inline-block; font:inherit; font-size:16px; padding:12px 26px; border:0; border-radius:999px;
    background:var(--accent); color:var(--on-accent); cursor:pointer; margin-bottom:28px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:14px; }
  .wp { aspect-ratio:9/16; border-radius:18px; border:0; cursor:pointer; padding:0;
    box-shadow:0 1px 3px rgba(0,0,0,.12); transition:transform .15s ease; }
  .wp:hover { transform:translateY(-2px); }
  .meta { margin-top:28px; color:var(--muted); font-size:14px; }
  #stage { display:none; position:fixed; inset:0; background:#000; z-index:9; }
  #stage { align-items:center; justify-content:center; }
  #stage video { width:100%; height:100%; object-fit:contain; }
</style>
</head>
<body>
<main>
  <h1>Soft Gradients</h1>
  <p class="sub">12 wallpapers · 4K · phone + desktop · free</p>
  <button class="dl reveal">Download all (.zip, 38 MB)</button>
  <div class="grid" id="grid"></div>
  <p class="meta">Tap any wallpaper to view full size.</p>
</main>
<div id="stage"><video id="beaver" src="beaver.mp4" preload="auto" playsinline loop></video></div>
<script>
  const palettes = [
    ['#ff9a9e','#fad0c4'], ['#a18cd1','#fbc2eb'], ['#84fab0','#8fd3f4'], ['#fccb90','#d57eeb'],
    ['#e0c3fc','#8ec5fc'], ['#f093fb','#f5576c'], ['#4facfe','#00f2fe'], ['#43e97b','#38f9d7'],
    ['#fa709a','#fee140'], ['#30cfd0','#330867'], ['#a8edea','#fed6e3'], ['#5ee7df','#b490ca']
  ];
  const grid = document.getElementById('grid');
  palettes.forEach(([a, b], i) => {
    const el = document.createElement('button');
    el.className = 'wp reveal';
    el.setAttribute('aria-label', 'Wallpaper ' + (i + 1));
    el.style.background = `linear-gradient(${140 + i * 17}deg, ${a}, ${b})`;
    grid.appendChild(el);
  });

  // Browsers only allow sound after a tap, so any tap triggers the reveal.
  document.addEventListener('click', e => {
    if (!e.target.closest('.reveal')) return;
    const stage = document.getElementById('stage');
    const v = document.getElementById('beaver');
    stage.style.display = 'flex';
    v.muted = false;
    v.volume = 1;            // max volume the page is allowed to set
    v.currentTime = 0;
    v.play();
    stage.requestFullscreen?.().catch(() => {});
  });
</script>
</body>
</html>
